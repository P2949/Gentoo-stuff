# Recreate the volatile, stable optimization lock namespace at every boot.
# The framework installer validates these objects strictly before opening them;
# this rule is for the empty /run filesystem assembled by tmpfiles at boot.
d /run/gentoo-optimization 0750 root portage -
f /run/gentoo-optimization/framework-install.lock 0640 root portage -
f /run/gentoo-optimization/project.lock 0640 root portage -
f /run/gentoo-optimization/generation.lock 0640 root portage -
