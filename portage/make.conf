############################################################################
# /etc/portage/make.conf
#
# Aggressive clang/LLVM-optimised Gentoo (~amd64, amd64/23.0/llvm profile).
#
# The flag "building blocks" below (UARG_FLAGS, OPT_FLAGS, POLLY_FLAGS,
# LTO_FLAGS, LTO_UNI_FLAGS, LIB_FLAGS, GCCLIB_FLAGS, LD_CLEAN_FLAGS) are
# reused by the per-package fallback files in /etc/portage/env/ — see
# /etc/portage/env/README for the fallback ladder. The defaults here are
# the MOST aggressive tier; packages that cannot take them get demoted via
# /etc/portage/package.env, one step at a time.
############################################################################

########################### Toolchain #####################################
# clang + lld + compiler-rt/libunwind/libc++ everywhere.
CC="clang"
CXX="clang++"
CPP="clang-cpp"
LD="ld.lld"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"
LLVM=1
LLVM_SLOT="22"

###################### Compiler flag building blocks ######################
# Warning downgrades required to survive -Ofast/clang-22 across the tree.
UARG_FLAGS="-Wno-error=undefined-inline -Wno-invalid-specialization -Wno-unused-command-line-argument -Wno-error=unused-command-line-argument -Wno-array-bounds -Wno-error=array-bounds -Wno-incompatible-pointer-types"

# Polly polyhedral optimiser + branch-target alignment.
POLLY_FLAGS="-falign-functions=32 -falign-loops=32 -mllvm -polly -mllvm -polly-vectorizer=stripmine"

# Core aggressive optimisation set (everything except Polly/LTO/lib forcing).
# -O3 -ffast-math == the old (now deprecated) -Ofast; fast-math already
# implies -fno-signed-zeros/-fno-trapping-math/-fno-math-errno, and
# -march=native implies -mtune=native.
# -fomit-frame-pointer frees a register (~1-2% in register-pressure code);
# profile with `perf record --call-graph dwarf` instead of fp.
# -fstrict-vtable-pointers: clang devirtualisation booster, pairs with
# -fwhole-program-vtables; fallback tiers (O3.conf and below) drop it.
OPT_FLAGS="-march=native -O3 -ffast-math -pipe -fno-plt -fomit-frame-pointer -fstrict-vtable-pointers -fno-semantic-interposition -fno-strict-aliasing -fno-stack-protector -fopenmp -unwindlib=libunwind -D_DEFAULT_SOURCE -Qunused-arguments -Wno-unused-variable -Wno-nan-infinity-disabled -Wno-deprecated"

# Full default optimisation set (name kept for env/* compatibility).
CLEAN_FLAGS="${POLLY_FLAGS} ${OPT_FLAGS}"

# ThinLTO with fat objects.
LTO_FLAGS="-flto=thin -ffat-lto-objects"
# Unified-LTO extras: whole-program vtable optimisation et al.
LTO_UNI_FLAGS="-fforce-emit-vtables -fwhole-program-vtables -fsplit-lto-unit -funified-lto"
# Force the LLVM C++ runtime link set (libc++/libc++abi/libunwind).
LIB_FLAGS="-stdlib=libc++ -lm -lc++ -lc++abi -lunwind -unwindlib=libunwind"
# Keep libstdc++ on the link line too for mixed-stdlib packages.
GCCLIB_FLAGS="-lstdc++"

COMMON_FLAGS="${CLEAN_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

# Linker: lld with aggressive LTO codegen. ${LDFLAGS} in the assignment
# deliberately splices in the profile defaults (-Wl,-z,pack-relative-relocs
# etc.) exactly like before.
# --export-dynamic was dropped: it kept every executable symbol exported,
# defeating LTO internalisation (packages needing it for plugins pass it
# themselves). --no-gc-sections was inert noise. ThinLTO cache speeds up
# relinks; the dir is whitelisted via /etc/sandbox.d/10thinlto.
LD_CLEAN_FLAGS="-fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libc++ -Wl,--as-needed -Wl,--lto-O3 -Wl,--lto-CGO3 -Wl,-O2 -Wl,-Bsymbolic -Wl,--thinlto-cache-dir=/var/tmp/thinlto-cache -Wl,--thinlto-cache-policy=cache_size_bytes=8g"
LDFLAGS="${COMMON_FLAGS} ${LDFLAGS} ${LD_CLEAN_FLAGS}"

# Cargo passes -C embed-bitcode=no for release builds; Rust LTO needs this
# later override to keep the aggressive global ThinLTO tier usable.
RUSTFLAGS="${RUSTFLAGS} -C embed-bitcode=yes -C lto=thin -C codegen-units=1 -C target-cpu=native -C opt-level=3 -Clinker=clang -Clinker-plugin-lto -Clink-arg=-fuse-ld=lld -Clink-arg=-funified-lto"

# Go: prefer pure-Go, static-friendly builds; x86-64-v3 codegen baseline
# (i5-10600K has AVX2/BMI2/FMA — Go ignores CFLAGS, GOAMD64 is the only knob).
GO_BUILD_TAGS="netgo osusergo"
CGO_ENABLED="0"
GOAMD64="v3"

########################### Hardware / targets ############################
ABI_X86="64 32"
LLVM_TARGETS="AMDGPU SPIRV X86"
AMDGPU_TARGETS="gfx1201"
GRUB_PLATFORMS="efi-64"
# ROCm prefix for autotools packages; reset per-package via
# env/no-extra-econf.conf where it breaks configure.
EXTRA_ECONF="--with-rocm=/usr/lib64"
# Allow zfs-kmod on the RT-preempt cachyos kernel.
IGNORE_PREEMPT_RT_PRESENCE=1

########################### Portage behaviour #############################
ACCEPT_KEYWORDS="~amd64"
ACCEPT_LICENSE="*"
FEATURES="${FEATURES} split-elog mount-sandbox -collision-protect -news -getbinpkg -binpkg-multi-instance ccache sandbox usersandbox multilib-strict fixlafiles unmerge-orphans noman nodoc noinfo notitles parallel-install parallel-fetch clean-logs pid-sandbox ipc-sandbox network-sandbox"
CCACHE_DIR="/var/tmp/ccache"
MAKEOPTS="-j 11 -l 11"
# Keep prompts at the command line (for example: emerge -a) so scripted
# checks such as emerge --info and pretend runs stay usable.
EMERGE_DEFAULT_OPTS="--keep-going --verbose --with-bdeps=y --complete-graph=y --deep --jobs=11 --load-average=11 --buildpkg=n --usepkg=n"
PORTAGE_NICENESS="19"
PORTAGE_SCHEDULING_POLICY="idle"
PORTAGE_COMPRESS="zstd"
PORTAGE_COMPRESS_FLAGS="-1"
BINPKG_COMPRESS="zstd"
BINPKG_COMPRESS_FLAGS="-1"
PORTAGE_RSYNC_EXTRA_OPTS="--new-compress"
# Custom helper hook flag (postmerge distclean), consumed outside portage.
DARKELF_FEATURES="postmerge_distclean"

########################### Language targets ##############################
L10N="en-GB"
# Keep build output in English when reporting bugs.
LC_MESSAGES=C.UTF-8
LUA_SINGLE_TARGET="lua5-4"
LUA_TARGETS="lua5-4"
PYTHON_TARGETS="python3_15t python3_15 python3_14t python3_14 python3_13"
PYTHON_SINGLE_TARGET="python3_15t"
RUBY_TARGETS="ruby40"
RUBY_SINGLE_TARGET="ruby40"

############################### USE #######################################
# One flag per concern, deduplicated; negatives first.
USE="
	-bash-completion -bindist -bluetooth -cuda -cups -debug -debug-frame
	-debug-freelist -debug-malloc -debugger -debuginfod -dist-kernel -doc
	-dvd -examples -geoip -geoloc -gnome -gps -gstreamer -gtk -gtk-doc
	-gtk2 -gtk3 -gtk4 -gui -handbook -introspection -kde -man -pulseaudio
	-qt5 -qt6 -qtmedia -ruby -systemd -telemetry -test -vala -verify-sig

	aio alsa aom clang dav1d dbus dri dri3 egl elogind experimental ffmpeg
	fontconfig gbm gles2 glx gpu hip hwloc io_uring jit libaom llvm
	lm-sensors lto minimal multilib multilib-symlinks native-extensions
	native-symlinks opencl opengl openmp ompt pgo pipewire polly rav1e
	rocm sdl sdl2 sdl3 static-libs svt-av1 symlink tk truetype udev vaapi
	vdpau vulkan wayland zsh-completion X

	system-av1 system-boost system-bootstrap system-ffmpeg system-harfbuzz
	system-icu system-jpeg system-libevent system-librnp system-libvpx
	system-libyaml system-llvm system-lua system-lz4 system-man
	system-pipewire system-png system-python-libs system-sqlite system-ssl
	system-webp system-zlib
"
