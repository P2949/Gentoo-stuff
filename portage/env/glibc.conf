# its configure tests reject.
COMMON_FLAGS="${CLEAN_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${LIB_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
