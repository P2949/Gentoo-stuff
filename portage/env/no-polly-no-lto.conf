# LLVM/Clang self-build fallback after ThinLTO itself exposes hidden LLVM
# inline/destructor references across libLLVM.so and libclang.so boundaries.
# Keep O3, fast-math, OpenMP, libc++, and strict vtable pointers; drop only
# Polly and all compile/link LTO options.
COMMON_FLAGS="${OPT_FLAGS} ${VTABLE_OPT_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LD_NO_LTO_FLAGS="${RUNTIME_LINK_FLAGS} -Wl,--as-needed -Wl,-O2 -Wl,-Bsymbolic ${FORCED_LIBS}"
LDFLAGS="${COMMON_FLAGS} ${LD_NO_LTO_FLAGS}"
