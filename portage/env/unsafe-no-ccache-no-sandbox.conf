# UNSAFE fallback profile.
#
# Disables ccache and Portage sandboxing for packages where sandboxing itself
# is known to break the build.
#
# This deliberately preserves inherited global FEATURES such as buildpkg,
# binpkg-multi-instance, and collision-protect.
#
# Do not use this when only ccache is the problem. Use no-ccache-only.conf
# instead.
FEATURES="${FEATURES} -ccache -sandbox -usersandbox -network-sandbox"
