# media-libs/mesa: -O3, plain ThinLTO (no unified/vtable extras), no forced
# -l* lib set.
O3_BASE_FLAGS="-march=native -O3 -pipe -ftree-vectorize -fomit-frame-pointer -fno-semantic-interposition -fno-signed-zeros -fno-trapping-math -fno-strict-aliasing -fno-math-errno -fno-stack-protector -D_DEFAULT_SOURCE -Qunused-arguments -Wno-unused-variable -Wno-nan-infinity-disabled -Wno-deprecated"
COMMON_FLAGS="${O3_BASE_FLAGS} ${LTO_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
