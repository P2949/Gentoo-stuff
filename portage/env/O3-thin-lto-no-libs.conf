# O3 + ThinLTO profile without explicit forced -l* runtime libraries.
#
# This is useful for packages that tolerate O3 and ThinLTO but fail when
# explicit runtime libraries are forced onto the link line.
#
# C++ still uses libc++ consistently through ${LIB_FLAGS} and
# ${RUNTIME_LINK_FLAGS}.

O3_BASE_FLAGS="-march=native -O3 -pipe -ftree-vectorize \
-fomit-frame-pointer -fno-semantic-interposition \
-fno-signed-zeros -fno-trapping-math -fno-strict-aliasing \
-fno-math-errno -fno-stack-protector -D_DEFAULT_SOURCE \
-Qunused-arguments -Wno-unused-variable -Wno-nan-infinity-disabled \
-Wno-deprecated"

COMMON_FLAGS="${O3_BASE_FLAGS} ${LTO_FLAGS} ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} ${RUNTIME_LINK_FLAGS} ${LD_OPT_FLAGS}"
