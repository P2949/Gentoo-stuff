############################################################################
# Xorg/Xwayland-style aggressive fallback.
#
# Keep O3 + ThinLTO + unified LTO, but drop the axes that commonly break
# Xserver-derived C code and libbsd-overlay compile/link probes:
#   - Polly
#   - OpenMP
#   - hidden visibility / C++ vtable pressure
#   - explicit forced -l* runtime libraries
############################################################################

COMMON_FLAGS="${O3_BASE_FLAGS} ${LTO_FLAGS} -funified-lto ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} ${RUNTIME_LINK_FLAGS} ${LD_OPT_FLAGS}"
