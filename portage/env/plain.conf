# Plain last-resort profile.
#
# Keep this as conservative as possible on compiler flags, but preserve
# inherited Portage safety/rollback FEATURES such as buildpkg,
# binpkg-multi-instance, and collision-protect.
COMMON_FLAGS="-O2 -pipe -march=native"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS}"
FEATURES="${FEATURES} -ccache"
