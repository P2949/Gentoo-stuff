# gui-wm/hyprland: O3 tier + force-include <string> (missing include in
# upstream headers under libc++).
O3_BASE_FLAGS="-march=native -O3 -pipe -ftree-vectorize -fno-omit-frame-pointer -fno-semantic-interposition -fno-signed-zeros -fno-trapping-math -fno-strict-aliasing -fno-math-errno -fno-stack-protector -D_DEFAULT_SOURCE -Qunused-arguments -Wno-unused-variable -Wno-nan-infinity-disabled -Wno-deprecated"
COMMON_FLAGS="${O3_BASE_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} --include string"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
