# x11-base/xwayland-9999:
# libbsd-overlay adds -isystem /usr/include/bsd -DLIBBSD_OVERLAY.
# That can shadow glibc's sys/cdefs.h, so force glibc cdefs first.
#
# Xwayland also uses GNU/Linux extension interfaces such as:
#   - struct ucred
#   - Dl_info / dladdr
# so expose them explicitly.
CPPFLAGS="${CPPFLAGS} -D_GNU_SOURCE -include /usr/include/sys/cdefs.h"
CFLAGS="${CFLAGS} -D_GNU_SOURCE"
CXXFLAGS="${CXXFLAGS} -D_GNU_SOURCE"
