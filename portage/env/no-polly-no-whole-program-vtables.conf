# LLVM/Clang self-build fallback: keep O3, OpenMP, ThinLTO, unified LTO,
# libc++, and vtable strictness, but drop whole-program vtables.
# clang-22.1.8's 32-bit libclang link can otherwise reference LLVM vfs
# destructors that are not exported from libLLVM.so; apply this to llvm
# first so the provider DSO is rebuilt with the same narrow fallback.
LTO_UNI_NO_WPV_FLAGS="-fforce-emit-vtables -fsplit-lto-unit -funified-lto"
COMMON_FLAGS="${OPT_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LTO_UNI_NO_WPV_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
