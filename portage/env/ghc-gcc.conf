# GHC's bootstrap/configure probes use GCC; avoid Clang-only diagnostics and
# linker/plugin flags from the global optimization experiment.
CFLAGS="-march=native -O3 -pipe -fno-strict-aliasing -fno-stack-protector -Wno-ignored-attributes -Wno-macro-redefined -Wno-error=deprecated-declarations"
CXXFLAGS="${CFLAGS}"
GHC_CFLAGS="${CFLAGS}"
FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"
# GHC links its runtime and bootstrap executables through the active LLVM
# linker; using the system GNU ld here triggers libffi's ABI probe failure
# (ffi_prep_cif: invalid version 11) during stage-1 linking.
LDFLAGS="-fuse-ld=lld -Wl,-O2 -Wl,--as-needed"
