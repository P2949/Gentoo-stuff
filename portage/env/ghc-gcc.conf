# GHC's bootstrap/configure probes use GCC; avoid Clang-only diagnostics and
# linker/plugin flags from the global optimization experiment.
CFLAGS="-march=native -O3 -pipe -fno-strict-aliasing -fno-stack-protector"
CXXFLAGS="${CFLAGS}"
FCFLAGS="${CFLAGS}"
FFLAGS="${CFLAGS}"
LDFLAGS="-Wl,-O2 -Wl,--as-needed"
