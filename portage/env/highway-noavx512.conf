# dev-cpp/highway + media-libs/libjxl: gcc, -O3, AVX512 hard-disabled
# (runtime dispatch miscompiles with AVX512 here). Keep the established mixed
# GCC-frontend/LLVM-binutils tuple explicit so its build identity is stable.
# The established native build uses GCC, but an explicit Clang IR profile
# wave must be allowed to select the reviewed Clang toolchain.  Keep the
# package-specific AVX512 workaround in both lanes without letting this
# legacy package.env override the lane's compiler-family contract.
if [[ ${GENTOO_OPT_MODE:-} == clang-ir-generate || ${GENTOO_OPT_MODE:-} == clang-ir-use ]]; then
    CC=clang-22
    CXX=clang++-22
else
    CC=gcc
    CXX=g++
fi
CPP=clang-cpp
LD=ld.lld
AR=llvm-ar
NM=llvm-nm
RANLIB=llvm-ranlib
CMAKE_EXTRA_ARGS="-DHWY_ENABLE_CONTRIB=OFF -DHWY_COMPILE_ALL_ATTRIBS=0"
COMMON_FLAGS="-pipe -march=native -O3"
CXXFLAGS="${COMMON_FLAGS} -DHWY_DISABLE_AVX512=1 -mno-avx512f -DHWY_COMPILE_ALL_ATTRIBS=0"
CFLAGS="${COMMON_FLAGS} -DHWY_DISABLE_AVX512=1 -mno-avx512f -DHWY_COMPILE_ALL_ATTRIBS=0"
LDFLAGS="${COMMON_FLAGS}"
