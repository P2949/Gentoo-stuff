# openal-soft builds its RT-audio mixers with -Werror=function-effects;
# clang 22 false-positives on their constexpr operator""_uz size_t literal
# ("nonblocking function calls non-nonblocking"). Demote to a warning —
# no optimization flags are changed.
CFLAGS="${CFLAGS} -Wno-error=function-effects"
CXXFLAGS="${CXXFLAGS} -Wno-error=function-effects"
