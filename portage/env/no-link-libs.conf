# Default aggressive profile minus explicit forced -l* runtime libraries.
#
# This keeps libc++ as the selected C++ standard library via -stdlib=libc++,
# but does not force -lc++, -lc++abi, -lunwind, -lstdc++, or -lm onto the
# link line.
#
# Use this when packages fail because explicit forced libraries confuse their
# configure/link probes, but the package should still use the default
# clang/libc++ toolchain.

COMMON_FLAGS="${CLEAN_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} ${RUNTIME_LINK_FLAGS} ${LD_OPT_FLAGS}"
