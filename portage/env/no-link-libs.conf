# Default LTO flags but without forcing the -l* library set into every
# link (still libc++ via -stdlib=). For packages whose link breaks on the
# extra libs (kmod, openmp-amdgcn device runtime).
COMMON_FLAGS="${CLEAN_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} -fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libc++ -Wl,--as-needed -Wl,-O2 -Wl,-Bsymbolic -Wl,--thinlto-cache-dir=/var/tmp/thinlto-cache -Wl,--thinlto-cache-policy=cache_size_bytes=8g"
