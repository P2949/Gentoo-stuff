# Conservative: plain -O2 -march=native, no LTO/Polly, but keep the libc++
# link set so the result still matches the system C++ runtime.
COMMON_FLAGS="-O2 -pipe -march=native ${LIB_FLAGS} ${UARG_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS}"
