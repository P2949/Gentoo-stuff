############################################################################
# Public-ABI aggressive profile: remove hidden visibility and explicit
# forced runtime libraries, but keep the rest of the global pressure tier.
#
# Use for C/C++ shared libraries whose public API must be exported and for
# self-hosting packages whose in-tree tools link against the just-built API.
############################################################################

COMMON_FLAGS="${POLLY_FLAGS} ${AGGRO_OPT_FLAGS} ${OPT_REMARK_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} ${RUNTIME_LINK_FLAGS} ${LD_OPT_FLAGS}"
