# Build with GCC instead of clang, using only GCC-valid aggressive flags
# (no Polly/-mllvm, no clang-only options). sys-devel/gcc, dev-lang/fpc.
# Preserve and declare the already-tested mixed tool tuple explicitly: GCC
# frontends/binutils with the system clang preprocessor and lld linker.
COMMON_FLAGS="-march=native -mtune=native -Ofast -pipe -falign-functions=32 -falign-loops=32 -ftree-vectorize -fno-plt -fomit-frame-pointer -fno-semantic-interposition -fno-signed-zeros -fno-trapping-math -fno-strict-aliasing -fno-math-errno -fno-stack-protector"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O2 -Wl,--as-needed"
CC="gcc"
CXX="g++"
CPP="clang-cpp"
LD="ld.lld"
AR="gcc-ar"
NM="gcc-nm"
RANLIB="gcc-ranlib"
