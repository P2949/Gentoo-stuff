# Shared-library ABI fallback: retain default visibility and avoid binding
# internal definitions locally, so established dynamic exports remain present.
COMMON_FLAGS="${OPT_FLAGS} ${VTABLE_OPT_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS} -O2 -fvisibility=default -fsemantic-interposition" -include /home/p2949/Desktop/Gentoo-stuff/portage/env/libsecret-abi-visibility.h
CXXFLAGS="${COMMON_FLAGS} -O2 -fvisibility=default -fsemantic-interposition" -include /home/p2949/Desktop/Gentoo-stuff/portage/env/libsecret-abi-visibility.h
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LD_NO_LTO_FLAGS="${RUNTIME_LINK_FLAGS} -Wl,--as-needed ${FORCED_LIBS}"
LDFLAGS="${COMMON_FLAGS} ${LD_NO_LTO_FLAGS} -fsemantic-interposition -O2 -Wl,--export-dynamic-symbol=*"
