# dev-lang/rust: LLVM 21 C/C++ frontends and archive tools, with the existing
# system LLVM 22 preprocessor/linker/nm and Rust linker kept explicit. This is
# a reviewed mixed lane, not a claim that every tool is LLVM 21.
COMMON_FLAGS="${OPT_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS} ${LIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
RUSTFLAGS="-C target-cpu=native -C opt-level=3 -Clinker=clang -Clink-arg=-fuse-ld=lld"
CC=clang-21
CXX=clang++-21
CPP=clang-cpp
LD=ld.lld
AR=/usr/lib/llvm/21/bin/llvm-ar
NM=llvm-nm
RANLIB=/usr/lib/llvm/21/bin/llvm-ranlib
