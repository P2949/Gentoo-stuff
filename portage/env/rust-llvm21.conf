# dev-lang/rust: build against the LLVM 21 toolchain, no linker-plugin LTO.
COMMON_FLAGS="${OPT_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS} ${LIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
RUSTFLAGS="-C target-cpu=native -C opt-level=3 -Clinker=clang -Clink-arg=-fuse-ld=lld"
CC=clang-21
CXX=clang++-21
AR=/usr/lib/llvm/21/bin/llvm-ar
RANLIB=/usr/lib/llvm/21/bin/llvm-ranlib
