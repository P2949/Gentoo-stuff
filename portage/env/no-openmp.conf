# -Ofast + full LTO but no Polly, no OpenMP, no forced lib link set, no
# -mtune/-unwindlib. For packages whose configure/runtime chokes on
# -fopenmp or the forced libs (wine, librt, ncurses-compat).
COMMON_FLAGS="-march=native -Ofast -pipe -ftree-vectorize -fno-plt -fno-omit-frame-pointer -fno-semantic-interposition -fno-signed-zeros -fno-trapping-math -fno-strict-aliasing -fno-math-errno -fno-stack-protector -D_DEFAULT_SOURCE -Qunused-arguments -Wno-unused-variable -Wno-nan-infinity-disabled -Wno-deprecated ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
