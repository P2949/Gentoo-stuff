# Aggressive default minus OpenMP and explicit forced -l* runtime libraries.
#
# Use this when a package fails because global -fopenmp affects configure,
# compile, or link behavior.
#
# This still uses clang/libc++ through -stdlib=libc++ and RUNTIME_LINK_FLAGS,
# but does not force the explicit FORCED_LIBS set onto the link line.

COMMON_FLAGS="-march=native -O3 -ffast-math -pipe -fno-plt \
-fomit-frame-pointer -fno-semantic-interposition -fno-strict-aliasing \
-fno-stack-protector -D_DEFAULT_SOURCE -Qunused-arguments \
-Wno-unused-variable -Wno-nan-infinity-disabled -Wno-deprecated \
${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${COMMON_FLAGS} ${RUNTIME_LINK_FLAGS} ${LD_OPT_FLAGS}"
