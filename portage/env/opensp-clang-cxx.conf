# OpenSP's legacy libtool link rules invoke the CXX tag with the value of CXX
# but omit the C++ runtime from the final executable link.  Keep the reviewed
# Clang lane while supplying the matching C++ driver/runtime explicitly.
CXX="clang++-22"
LDFLAGS="${LDFLAGS} -lstdc++"
CC="clang"
CPP="clang-cpp"
LD="ld.lld"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"
# Portage's zstd documentation symlink repair currently crashes on OpenSP's
# legacy compressed-link layout. Keep this exact package lane uncompressed;
# it does not alter compiled artifacts or profile-use flags.
PORTAGE_COMPRESS=""
