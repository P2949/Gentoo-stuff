# Default flags (incl. Polly) but plain ThinLTO only — no unified-LTO /
# vtable extras. For packages broken by -funified-lto/-fwhole-program-vtables.
COMMON_FLAGS="${CLEAN_FLAGS} ${LTO_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
RUSTFLAGS="-C lto=thin -C codegen-units=1 -C embed-bitcode=yes -C target-cpu=native -C opt-level=3 -Clinker=clang -Clinker-plugin-lto -Clink-arg=-fuse-ld=lld"
