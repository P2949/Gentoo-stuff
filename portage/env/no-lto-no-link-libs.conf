# Aggressive non-LTO fallback without forcing the extra -l* runtime
# libraries. Use for device/runtime links that must emit their own LLVM
# bitcode and break when host ThinLTO/unified-LTO decoration is injected.
COMMON_FLAGS="${CLEAN_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LD_NO_LTO_NO_FORCED_LIBS="${RUNTIME_LINK_FLAGS} -Wl,--as-needed -Wl,-O2 -Wl,-Bsymbolic"
LDFLAGS="${COMMON_FLAGS} ${LD_NO_LTO_NO_FORCED_LIBS}"
RUSTFLAGS="-C codegen-units=1 -C embed-bitcode=yes -C target-cpu=native -C opt-level=3 -Clinker=clang -Clink-arg=-fuse-ld=lld"
