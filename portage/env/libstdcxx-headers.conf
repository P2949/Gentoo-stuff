# clang but against GCC's libstdc++ via the active gcc-16 install; ccache
# off. For packages that hard-require libstdc++ internals (ragel, colm).
FEATURES="-ccache sandbox usersandbox multilib-strict fixlafiles unmerge-orphans noman nodoc noinfo notitles parallel-install parallel-fetch clean-logs network-sandbox"
GCC_STDLIB_DIR="/usr/lib/gcc/x86_64-pc-linux-gnu/16"
GCC_CXX_FLAGS="-stdlib=libstdc++ --gcc-install-dir=${GCC_STDLIB_DIR}"
COMMON_FLAGS="${CLEAN_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"
CMAKE_EXTRA_VARIABLES="-DCMAKE_HIP_FLAGS=${GCC_CXX_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${GCC_CXX_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} -fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libstdc++ ${LD_OPT_FLAGS} -lstdc++ -lm -lgcc_s -lunwind"
