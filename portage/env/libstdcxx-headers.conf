# Clang against the active GCC installation's libstdc++. Do not pin a GCC
# major or installation directory here: clang's driver discovers the active
# GCC layout, so compiler upgrades cannot leave a stale --gcc-install-dir.
# Disables ccache only; inherited sandbox and rollback features stay active.
# For packages that hard-require libstdc++ internals (ragel, colm).
FEATURES="${FEATURES} -ccache"
GCC_CXX_FLAGS="-stdlib=libstdc++"
COMMON_FLAGS="${CLEAN_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"
CMAKE_EXTRA_VARIABLES="-DCMAKE_HIP_FLAGS=${GCC_CXX_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${GCC_CXX_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} -fuse-ld=lld -rtlib=compiler-rt -unwindlib=libunwind -stdlib=libstdc++ ${LD_OPT_FLAGS} -lstdc++ -lm -lgcc_s -lunwind"
CC="clang"
CXX="clang++"
CPP="clang-cpp"
LD="ld.lld"
AR="llvm-ar"
NM="llvm-nm"
RANLIB="llvm-ranlib"
