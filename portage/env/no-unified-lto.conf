# Default flags minus unified-LTO extras. Keeps Polly, O3, OpenMP,
# strict vtable pointers, libc++, and plain ThinLTO. Use for packages
# whose mixed bitcode link objects cannot all participate in unified LTO.
COMMON_FLAGS="${CLEAN_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LIB_FLAGS} ${UARG_FLAGS} ${GCCLIB_FLAGS}"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
RUSTFLAGS="-C embed-bitcode=yes -C lto=thin -C codegen-units=1 -C target-cpu=native -C opt-level=3 -Clinker=clang -Clinker-plugin-lto -Clink-arg=-fuse-ld=lld"
