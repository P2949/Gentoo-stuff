# Strict no-op mode.  This file is safe to assign during ordinary builds.
GENTOO_OPT_MODE="off"
GENTOO_OPT_BOLT_STAGE="off"
GENTOO_OPT_PROFILE_MAP_READY="0"
GENTOO_OPT_BOLT_GCC_READY="0"

# During the durable de-instrumentation transaction, this environment is
# sourced after make.conf and package.env.  Replace the generation's global
# aggressive policy so recovery builds cannot recreate instrumented or
# incompatible ThinLTO artifacts.
if [[ ${GENTOO_OPT_DEINSTRUMENT-} == 1 ||
    -f /var/lib/gentoo-optimization/state/deinstrument.pending ]]; then
    COMMON_FLAGS="-O2 -pipe"
    CFLAGS="${COMMON_FLAGS}"
    CXXFLAGS="${COMMON_FLAGS}"
    FCFLAGS="${COMMON_FLAGS}"
    FFLAGS="${COMMON_FLAGS}"
    LDFLAGS="-Wl,--as-needed"
    RUSTFLAGS=""
    CARGO_BUILD_RUSTFLAGS=""
    CARGO_ENCODED_RUSTFLAGS=""
    GOFLAGS=""
    export COMMON_FLAGS CFLAGS CXXFLAGS FCFLAGS FFLAGS LDFLAGS
    export RUSTFLAGS CARGO_BUILD_RUSTFLAGS CARGO_ENCODED_RUSTFLAGS GOFLAGS
fi
