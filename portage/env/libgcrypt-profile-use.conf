# libgcrypt's configure probes compile tiny capability tests with -Werror.
# Profile-use data is intentionally incomplete for those probes, so Clang's
# profile freshness/unprofiled diagnostics must remain warnings; this does
# not disable FIPS or alter the generated-code optimization policy.
CFLAGS="${CFLAGS} -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
CXXFLAGS="${CXXFLAGS} -Wno-error=profile-instr-out-of-date -Wno-error=profile-instr-unprofiled"
