# OpenBLAS builds a Fortran interface with gfortran.  Keep the C/C++
# optimization policy, but do not pass Clang-only driver and LLVM flags to the
# GNU Fortran frontend through the global FCFLAGS/FFLAGS assignments.
FORTRAN_SAFE_FLAGS="-O2 -pipe -march=native -fno-second-underscore"
CFLAGS="-O2 -pipe -march=native -fopenmp=libgomp"
CXXFLAGS="-O2 -pipe -march=native -fopenmp=libgomp"
FCFLAGS="${FORTRAN_SAFE_FLAGS}"
FFLAGS="${FORTRAN_SAFE_FLAGS}"
# The OpenBLAS configure probe links a C object through gfortran; its driver
# therefore consumes LDFLAGS too. Keep Clang-only linker/compiler policy out
# of that probe and the subsequent Fortran link steps.
LDFLAGS="-O2 -pipe -march=native -fopenmp=libgomp -Wl,--as-needed"
