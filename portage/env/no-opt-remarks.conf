############################################################################
# Remove optimization remark output.
#
# Use when generated optimization-record files confuse build systems, fill
# disks, cause install collisions, or create unreasonable build-tree noise.
############################################################################

COMMON_FLAGS="${POLLY_FLAGS} ${AGGRO_OPT_FLAGS} ${VISIBILITY_FLAGS} ${VTABLE_OPT_FLAGS} ${LTO_FLAGS} ${LTO_UNI_FLAGS} ${UARG_FLAGS}"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS} ${CXX_VISIBILITY_FLAGS} ${LIB_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"

LDFLAGS="${LDFLAGS} ${COMMON_FLAGS} ${LD_CLEAN_FLAGS}"
