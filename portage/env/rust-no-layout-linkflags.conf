############################################################################
# Rust demotion: remove BOLT/section linker layout flags.
#
# Use when Rust package links fail because lld rejects the extra layout flags.
############################################################################

RUSTFLAGS="-C embed-bitcode=yes -C lto=thin -C codegen-units=1 -C target-cpu=native -C opt-level=3 -C panic=abort -Clinker=clang -Clinker-plugin-lto -Clink-arg=-fuse-ld=lld -Clink-arg=-funified-lto"
