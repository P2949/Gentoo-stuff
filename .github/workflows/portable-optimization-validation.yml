name: Portable optimization validation

"on":
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-optimization-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install portable validation dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            attr binutils clang curl file jq libc++-dev libc++abi-dev \
            libcap2-bin pax-utils python3-jsonschema ripgrep util-linux \
            xz-utils zstd
          test -x /usr/sbin/runuser
          dpkg-query --search /usr/sbin/runuser |
            grep -Fx 'util-linux: /usr/sbin/runuser'
          if [[ ! -e /usr/bin/runuser && ! -L /usr/bin/runuser ]]; then
            sudo ln --symbolic -- /usr/sbin/runuser /usr/bin/runuser
          fi
          test "$(readlink --canonicalize-existing /usr/bin/runuser)" = \
            /usr/sbin/runuser
          /usr/bin/runuser --version

      - name: Install the reviewed ShellCheck 0.11.0 binary
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          root="$RUNNER_TEMP/shellcheck-v0.11.0"
          binary="$root/shellcheck"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          printf '%s  %s\n' \
            8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 \
            "$archive" | sha256sum --check --strict
          mkdir --mode=0700 -- "$root"
          tar --extract --xz --file "$archive" --strip-components=1 \
            --directory "$root" shellcheck-v0.11.0/shellcheck
          printf '%s  %s\n' \
            4da528ddb3a4d1b7b24a59d4e16eb2f5fd960f4bd9a3708a15baddbdf1d5a55b \
            "$binary" | sha256sum --check --strict
          version_output=$("$binary" --version)
          grep -Fx 'version: 0.11.0' <<<"$version_output"
          printf '%s\n' "$version_output"
          printf 'SHELLCHECK=%s\n' "$binary" >>"$GITHUB_ENV"

      - name: Run the portable-complete gate
        env:
          PATH: /usr/bin:/bin
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          output=/tmp/gentoo-optimization-portable-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          test ! -e "$output"
          mkdir --mode=0700 -- "$output"

          git_home=$RUNNER_TEMP/portable-precontract-git-home
          test ! -e "$git_home"
          mkdir --mode=0700 -- "$git_home"
          head_sha=$(GIT_CONFIG_NOSYSTEM=1 HOME="$git_home" \
            /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            rev-parse --verify 'HEAD^{commit}')
          tree_sha=$(GIT_CONFIG_NOSYSTEM=1 HOME="$git_home" \
            /usr/bin/git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
            rev-parse --verify 'HEAD^{tree}')
          test "$head_sha" = "$GITHUB_SHA"
          {
            printf 'schema=portable-precontract-provenance-v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'event_name=%s\n' "$GITHUB_EVENT_NAME"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'github_sha=%s\n' "$GITHUB_SHA"
            printf 'head_sha=%s\n' "$head_sha"
            printf 'tree_sha=%s\n' "$tree_sha"
          } >"$output/workflow-provenance.txt"

          contract_status=0
          /usr/bin/python3 -I -B scripts/optimization/verify/phase2-test-contract.py check \
            --repository-root . \
            --contract optimization/phase2-authoritative-test-contract.json \
            >"$output/test-contract-static-check.log" 2>&1 || contract_status=$?
          printf 'exit_status=%d\n' "$contract_status" \
            >"$output/test-contract-static-check.status"
          cat -- "$output/test-contract-static-check.log"
          if ((contract_status != 0)); then
            exit "$contract_status"
          fi

          run_output=$output/portable-complete
          test ! -e "$run_output"
          /usr/bin/bash tests/run-optimization-tests.sh \
            --mode portable-complete \
            --output-dir "$run_output"
          grep -Fx 'mode=portable-complete' "$run_output/summary.txt"
          grep -Fx 'fail=0' "$run_output/summary.txt"
          test -f "$run_output/results.tsv"
          test -f "$run_output/subtests.tsv"
          test -f "$run_output/test-run-provenance.json"
          test -f "$run_output/test-contract-static-check.log"
          test -f "$run_output/test-contract.log"
          grep -Eq '^PASS[[:space:]]+framework-installer[[:space:]]+' \
            "$run_output/results.tsv"

      - name: Upload portable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-optimization-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gentoo-optimization-portable-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
